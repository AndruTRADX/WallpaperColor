# Builds the portable binaries and publishes them on GitHub Releases.
#   git tag v0.1.0 && git push origin v0.1.0   -> release v0.1.0 with the tarball attached
# Run by hand (Actions tab -> Release -> Run workflow) to only build and download the tarball.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Ubuntu 24.04 has glibc 2.39: the binaries run on that and anything newer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build pkg-config libsystemd-dev libstb-dev

      - name: Tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -nE 's/^project\(WallpaperColor VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME but CMakeLists.txt says $version"
            exit 1
          fi

      - name: Build, test and package
        env:
          CC: gcc-14
          CXX: g++-14
        run: packaging/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wallpapercolor
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
