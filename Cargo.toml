[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["AndruTRADX"]
repository = "https://github.com/AndruTRADX/WallpaperColor"

[workspace.dependencies]
wpc-core = { path = "crates/wpc-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ratatui = "0.30"
toml_edit = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
