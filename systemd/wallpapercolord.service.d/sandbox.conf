# The rest of the sandbox, for systems whose user services can have user namespaces (most:
# install.sh tries first, and installs this only where they work). The whole system becomes
# read-only to the service except its runtime folder (its socket): it reads its settings, the
# pictures and the drivers, and writes nothing else.
[Service]
PrivateUsers=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=%t
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectHostname=yes
CapabilityBoundingSet=
